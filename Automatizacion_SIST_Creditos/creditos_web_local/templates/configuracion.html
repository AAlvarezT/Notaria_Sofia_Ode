{% extends 'base.html' %}
{% block title %}Configuración{% endblock %}
{% block content %}
<h1>Configuración</h1>
<form method="post" action="/configuracion" class="config-form">
  <label>Carpeta de SIGNO<input type="text" name="signo_folder" value="{{ config.get('signo_folder','') }}" /></label>
  <label>Moneda predeterminada<input type="text" name="currency_default" value="{{ config.get('currency_default','PEN') }}" /></label>
  <label>Frecuencia de comprobación (minutos)<input type="number" name="check_frequency_minutes" value="{{ config.get('check_frequency_minutes',15) }}" /></label>
  <label>Días de anticipación<input type="number" name="days_advance" value="{{ config.get('days_advance',7) }}" /></label>
  <label>Cuenta Outlook<input type="text" name="outlook_account" value="{{ config.get('outlook_account','') }}" /></label>
  <label>Almacén de borradores<input type="text" name="outlook_drafts_store" value="{{ config.get('outlook_drafts_store','') }}" /></label>
  <label><input type="checkbox" name="outlook_enabled" {% if config.get('outlook_enabled') %}checked{% endif %}/> Habilitar integración Outlook</label>
  <button type="submit">Guardar</button>
</form>
{% endblock %}
