<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Créditos web local{% endblock %}</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">Gestión de créditos</div>
    <nav>
      <a href="/">Inicio</a>
      <a href="/cartera">Cartera</a>
      <a href="/cobranza">Cobranza</a>
      <a href="/revision">Revisión</a>
      <a href="/configuracion">Configuración</a>
    </nav>
  </header>
  <main class="container">
    {% if message %}
    <div class="flash flash-success">{{ message }}</div>
    {% endif %}
    {% if error %}
    <div class="flash flash-error">{{ error }}</div>
    {% endif %}
    {% block content %}{% endblock %}
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
